# beCafé: una sola instancia con el volumen persistente en /data (RT-003, RT-010).
# Las variables se definen en el entorno o en un .env junto a este archivo (docs/operacion.md §2).
# En Coolify, defínelas en la interfaz. ORIGIN es la dirección pública con la que entran las personas (https://…).
services:
  becafe:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-desconocido}
    restart: unless-stopped
    # Proxy inverso propio, fuera de Coolify: publica el puerto 5374 del servidor (la aplicación escucha en 3000 dentro).
    ports:
      - '5374:3000'
    environment:
      - ORIGIN=${ORIGIN:?Define ORIGIN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_INICIAL_EMAIL=${ADMIN_INICIAL_EMAIL:?Define ADMIN_INICIAL_EMAIL}
      - ADMIN_INICIAL_NOMBRE=${ADMIN_INICIAL_NOMBRE:?Define ADMIN_INICIAL_NOMBRE}
      # Las cinco de S3 van juntas: defínelas todas en Coolify o quita las cinco líneas (copias desactivadas).
      # Con la forma `CLAVE=${CLAVE}` Coolify las analiza bien; la forma `- CLAVE` sin `=` rompe su analizador.
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      # Notificaciones push (PUBLIC_VAPID_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT): añade las tres líneas
      # con la misma forma cuando actives push y definas sus valores en Coolify.
    volumes:
      - datos:/data

volumes:
  datos:
