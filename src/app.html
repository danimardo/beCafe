		/>
		<script nonce="%sveltekit.nonce%">
			// Resuelve el tema ANTES de pintar para evitar el parpadeo.
			// Preferencia guardada: 'auto' | 'claro' | 'oscuro'. Por defecto: 'auto' (sigue al dispositivo).
			(function () {
				var pref = 'auto';
				try {
					pref = localStorage.getItem('becafe-tema') || 'auto';
				} catch (e) {}
				var dark = pref === 'oscuro' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.setAttribute('data-theme', dark ? 'oscuro' : 'claro');
			})();
		</script>
		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
